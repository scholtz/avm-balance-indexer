name: Nightly benchmark

# Indexes the 10,000 newest Algorand MainNet rounds and the 100,000 newest Voi rounds into PostgreSQL and into Cassandra (each on
# its own runner, alone with its database), measures the stored size and the API latency, counts the tokens found and their
# holders, and publishes the comparison:
#   - the run's summary page (Actions -> Nightly benchmark -> latest run),
#   - the artifacts bench-postgres / bench-cassandra (raw JSON),
#   - the branch `benchmark-results`: latest.md, latest-<chain>-<provider>.json and history/ (one JSON file per night, chain and provider).
# See docs/benchmarks.md.

on:
  schedule:
    - cron: "17 2 * * *"
  # A change to the benchmark or this workflow runs a short version (500 rounds) to prove the pipeline works; it publishes nothing.
  pull_request:
    paths:
      - .github/workflows/benchmark.yml
      - tools/AvmBalanceIndexer.Benchmark/**
  workflow_dispatch:
    inputs:
      rounds:
        description: Number of newest MainNet rounds to index
        default: "10000"
      voi_rounds:
        description: Number of newest Voi rounds to index
        default: "100000"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ROUNDS: ${{ inputs.rounds || (github.event_name == 'pull_request' && '500') || '10000' }}
  VOI_ROUNDS: ${{ inputs.voi_rounds || (github.event_name == 'pull_request' && '500') || '100000' }}
  BENCH: tools/AvmBalanceIndexer.Benchmark/bin/Release/net10.0/AvmBalanceIndexer.Benchmark.dll
  API: src/AvmBalanceIndexer.Api/bin/Release/net10.0/AvmBalanceIndexer.Api.dll

jobs:
  range:
    name: Choose the rounds
    runs-on: ubuntu-latest
    outputs:
      mainnet: ${{ steps.tip.outputs.mainnet }}
      voi: ${{ steps.tip.outputs.voi }}
    steps:
      # Both databases index exactly the same blocks, whenever their runners start.
      - id: tip
        run: |
          last() { curl -fsS "$1/v2/status" | python3 -c 'import sys,json;print(json.load(sys.stdin)["last-round"])'; }
          echo "mainnet=$(( $(last https://mainnet-api.4160.nodely.dev) - 300 ))" >> "$GITHUB_OUTPUT"
          echo "voi=$(( $(last https://mainnet-api.voi.nodely.dev) - 300 ))" >> "$GITHUB_OUTPUT"

  postgres:
    name: PostgreSQL
    needs: range
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: avm
          POSTGRES_PASSWORD: avm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avm -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build src/AvmBalanceIndexer.Api -c Release && dotnet build tools/AvmBalanceIndexer.Benchmark -c Release
      - name: MainNet
        run: >
          dotnet $BENCH run --provider postgres --chain algorand-mainnet --rounds "$ROUNDS" --last-round "${{ needs.range.outputs.mainnet }}"
          --commit "$GITHUB_SHA" --out results --api-dll $API
          --postgres "Host=localhost;Port=5432;Username=avm;Password=avm;Database=postgres"
      - name: Voi
        run: >
          dotnet $BENCH run --provider postgres --chain voi --rounds "$VOI_ROUNDS" --last-round "${{ needs.range.outputs.voi }}"
          --commit "$GITHUB_SHA" --out results --api-dll $API
          --postgres "Host=localhost;Port=5432;Username=avm;Password=avm;Database=postgres"
      - run: |
          for file in results/bench-*-postgres.json; do dotnet $BENCH report "$file" --out "results/$(basename "$file" .json).md" >/dev/null; done
          cat results/bench-*-postgres.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-postgres
          path: results

  cassandra:
    name: Cassandra
    needs: range
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      cassandra:
        image: cassandra:5.0
        env:
          CASSANDRA_CLUSTER_NAME: avm-bench
          CASSANDRA_DC: dc1
          CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
          MAX_HEAP_SIZE: 2G
          HEAP_NEWSIZE: 400M
        ports: ["9042:9042"]
        options: >-
          --health-cmd "cqlsh -e 'describe cluster' localhost 9042"
          --health-interval 15s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build src/AvmBalanceIndexer.Api -c Release && dotnet build tools/AvmBalanceIndexer.Benchmark -c Release
      - name: MainNet
        run: >
          dotnet $BENCH run --provider cassandra --chain algorand-mainnet --rounds "$ROUNDS" --last-round "${{ needs.range.outputs.mainnet }}"
          --commit "$GITHUB_SHA" --out results --api-dll $API
          --cassandra localhost:9042 --dc dc1 --cassandra-container "$(docker ps -q --filter ancestor=cassandra:5.0 | head -1)"
      - name: Voi
        run: >
          dotnet $BENCH run --provider cassandra --chain voi --rounds "$VOI_ROUNDS" --last-round "${{ needs.range.outputs.voi }}"
          --commit "$GITHUB_SHA" --out results --api-dll $API
          --cassandra localhost:9042 --dc dc1 --cassandra-container "$(docker ps -q --filter ancestor=cassandra:5.0 | head -1)"
      - run: |
          for file in results/bench-*-cassandra.json; do dotnet $BENCH report "$file" --out "results/$(basename "$file" .json).md" >/dev/null; done
          cat results/bench-*-cassandra.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-cassandra
          path: results

  publish:
    name: Publish comparison
    runs-on: ubuntu-latest
    needs: [postgres, cassandra]
    permissions:
      contents: write
    # Two overlapping runs (the schedule and a manual start) must not race for the branch.
    concurrency: benchmark-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          path: results
      - run: dotnet build tools/AvmBalanceIndexer.Benchmark -c Release
      - name: Render the comparisons
        run: |
          : > comparison.md
          for chain in algorand-mainnet voi; do
            echo "## $chain" >> comparison.md
            echo >> comparison.md
            dotnet $BENCH report "results/bench-cassandra/bench-$chain-cassandra.json" "results/bench-postgres/bench-$chain-postgres.json" --out "comparison-$chain.md" > /dev/null
            sed 's/^### /#### /' "comparison-$chain.md" >> comparison.md
            echo >> comparison.md
          done
          cat comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit to the benchmark-results branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin benchmark-results >/dev/null; then
            git fetch origin benchmark-results
            git worktree add ../out benchmark-results
          else
            git worktree add --orphan -b benchmark-results ../out
          fi
          mkdir -p ../out/history
          for provider in postgres cassandra; do
            for chain in algorand-mainnet voi; do
              file="results/bench-$provider/bench-$chain-$provider.json"
              day="$(python3 -c 'import sys,json;print(json.load(open(sys.argv[1]))["date"])' "$file")"
              cp "$file" "../out/latest-$chain-$provider.json"
              cp "$file" "../out/history/$day-$chain-$provider.json"
            done
          done
          rm -f ../out/latest-postgres.json ../out/latest-cassandra.json
          printf '# Latest nightly benchmark\n\nPostgreSQL against Cassandra on the newest MainNet and Voi rounds. Updated every night by the workflow `Nightly benchmark`; older results are in `history/`. How it is measured: docs/benchmarks.md on the main branch.\n\n' | cat - comparison.md > ../out/latest.md
          cd ../out
          git add -A
          git commit -m "Nightly benchmark $(date -u +%F)" || exit 0
          git pull --rebase origin benchmark-results || true
          git push origin benchmark-results
