name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Tests use this server instead of starting a container of their own.
  AVM_TEST_POSTGRES: Host=localhost;Port=5432;Database=avm_indexer;Username=avm;Password=avm
  AVM_TEST_CASSANDRA: localhost:9042
  AVM_TEST_CASSANDRA_DC: dc1

jobs:
  build-test:
    name: Build, unit and storage contract tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: avm_indexer
          POSTGRES_USER: avm
          POSTGRES_PASSWORD: avm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avm -d avm_indexer"
          --health-interval 5s --health-timeout 3s --health-retries 20
      cassandra:
        image: cassandra:5.0
        env:
          CASSANDRA_CLUSTER_NAME: avm-ci
          CASSANDRA_DC: dc1
          CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
          MAX_HEAP_SIZE: 1G
          HEAP_NEWSIZE: 256M
        ports: ["9042:9042"]
        options: >-
          --health-cmd "cqlsh -e 'describe cluster' localhost 9042"
          --health-interval 15s --health-timeout 10s --health-retries 30
    env:
      # Network tests run in their own job.
      AVM_SKIP_LIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore AvmBalanceIndexer.slnx
      - run: dotnet build AvmBalanceIndexer.slnx -c Release --no-restore
      - run: dotnet test AvmBalanceIndexer.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults

  live-network:
    name: Live network (first 1000 rounds)
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: avm_indexer
          POSTGRES_USER: avm
          POSTGRES_PASSWORD: avm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avm -d avm_indexer"
          --health-interval 5s --health-timeout 3s --health-retries 20
      cassandra:
        image: cassandra:5.0
        env:
          CASSANDRA_CLUSTER_NAME: avm-ci-live
          CASSANDRA_DC: dc1
          CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
          MAX_HEAP_SIZE: 1G
          HEAP_NEWSIZE: 256M
        ports: ["9042:9042"]
        options: >-
          --health-cmd "cqlsh -e 'describe cluster' localhost 9042"
          --health-interval 15s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Indexes the first 1000 rounds of Algorand TestNet and MainNet from public archival nodes into PostgreSQL and into
      # Cassandra and compares every balance with the ledger state deltas published by a public algod.
      - run: dotnet test tests/AvmBalanceIndexer.Live.Tests -c Release --logger "trx;LogFileName=live.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-test-results
          path: TestResults

  docker:
    name: Docker build (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        component: [api, worker]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.component }}
          push: false
          tags: avm-balance-indexer/${{ matrix.component }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: VERSION is major.minor (image tags, release tags v<VERSION>.N)
        run: grep -Eq '^[0-9]+\.[0-9]+$' VERSION
      - uses: azure/setup-helm@v5
      - run: |
          for v in deploy/helm/values/*.yaml; do
            echo "== $v"
            helm lint deploy/helm/avm-balance-indexer -f "$v" --set cassandra.embedded.node=ci-node
            helm template ci deploy/helm/avm-balance-indexer -f "$v" --set cassandra.embedded.node=ci-node > /dev/null
          done
      - name: Upgrade options render (per-component tags, Recreate strategy, invalid strategy refused)
        run: |
          out=$(helm template ci deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml \
            --set cassandra.embedded.node=ci-node --set image.apiTag=old-api --set image.workerTag=new-worker --set worker.strategy=Recreate)
          echo "$out" | grep -q 'image: .*-api:old-api'
          echo "$out" | grep -q 'image: .*-worker:new-worker'
          echo "$out" | grep -q 'type: Recreate'
          if helm template ci deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=ci-node --set worker.strategy=recreate > /dev/null 2>&1; then
            echo "an invalid worker.strategy must fail the render"; exit 1
          fi
          helm template ci deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=ci-node --set api.pathBase=/avm-testnet | grep -q 'Api__PathBase: "/avm-testnet"'
          for bad in /avm-testnet/ /.. /a/. avm-testnet; do
            if helm template ci deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=ci-node --set "api.pathBase=$bad" > /dev/null 2>&1; then
              echo "the pathBase '$bad' must fail the render"; exit 1
            fi
          done
      - name: Deployment overlays render (hostPath, ingress host, embedded Cassandra contact point)
        run: |
          check() { # overlay release hostPath host
            out=$(helm template "$2" deploy/helm/avm-balance-indexer -f "deploy/helm/values/$1.yaml" --set image.repository=docker.io/acme/avm-balance-indexer --set image.tag=t1 --set cassandra.embedded.node=node-1)
            echo "$out" | grep -q "path: \"$3\"" || { echo "$1: hostPath $3 missing"; exit 1; }
            echo "$out" | grep -q "host: \"$4\"" || { echo "$1: ingress host $4 missing"; exit 1; }
            echo "$out" | grep -q "kubernetes.io/ingress.class: nginx" || { echo "$1: ingress class annotation missing"; exit 1; }
            echo "$out" | grep -q "cert-manager.io/cluster-issuer: letsencrypt-dns" || { echo "$1: cluster issuer annotation missing"; exit 1; }
            echo "$out" | grep -q "image: docker.io/acme/avm-balance-indexer-api:t1" || { echo "$1: api image name wrong"; exit 1; }
            echo "$out" | grep -q "Storage__Cassandra__ContactPoints__0: \"$2-.*-cassandra\"" || { echo "$1: contact point missing"; exit 1; }
            if echo "$out" | grep -q "Storage__Cassandra__Password"; then echo "$1: embedded Cassandra must not need a secret"; exit 1; fi
          }
          check stage-testnet testnet /mnt/nvme1/avm-balance-indexer/testnet testnet.balance-indexer.biatec.io
          check prod-algorand mainnet /mnt/nvme1/avm-balance-indexer/mainnet mainnet.balance-indexer.biatec.io
          check prod-voi voi /mnt/nvme1/avm-balance-indexer/voi voi.balance-indexer.biatec.io
          out=$(helm template x deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=node-1)
          echo "$out" | grep -q 'kubernetes.io/hostname: "node-1"' || { echo "the node selector is missing"; exit 1; }
          out=$(helm template x deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=node-1 --set networkPolicy.enabled=false)
          if echo "$out" | grep -q "kind: NetworkPolicy"; then echo "networkPolicy.enabled=false must render no NetworkPolicy"; exit 1; fi
          echo "$out" | grep -q "kind: Deployment" || { echo "the deployments must still render"; exit 1; }
          if echo "$out" | grep -q "kind: StatefulSet"; then echo "the chart must not need StatefulSet rights"; exit 1; fi
          out=$(helm template x deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=node-1 --set api.podDisruptionBudget.enabled=false)
          if echo "$out" | grep -q "kind: PodDisruptionBudget"; then echo "api.podDisruptionBudget.enabled=false must render no PodDisruptionBudget"; exit 1; fi
          if helm template x deploy/helm/avm-balance-indexer --set cassandra.embedded.enabled=true --set storage.provider=Cassandra --set cassandra.embedded.node=n > /dev/null 2>&1; then
            echo "the embedded Cassandra without a hostPath must fail the render"; exit 1
          fi
          if helm template x deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=n --set storage.cassandra.replicationFactor=3 > /dev/null 2>&1; then
            echo "the embedded Cassandra with replication factor 3 must fail the render"; exit 1
          fi
          if helm template x deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml > /dev/null 2>&1; then
            echo "the embedded Cassandra without a node must fail the render"; exit 1
          fi
