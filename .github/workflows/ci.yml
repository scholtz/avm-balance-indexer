name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Tests use this server instead of starting a container of their own.
  AVM_TEST_POSTGRES: Host=localhost;Port=5432;Database=avm_indexer;Username=avm;Password=avm
  AVM_TEST_CASSANDRA: localhost:9042
  AVM_TEST_CASSANDRA_DC: dc1

jobs:
  build-test:
    name: Build, unit and storage contract tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: avm_indexer
          POSTGRES_USER: avm
          POSTGRES_PASSWORD: avm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avm -d avm_indexer"
          --health-interval 5s --health-timeout 3s --health-retries 20
      cassandra:
        image: cassandra:5.0
        env:
          CASSANDRA_CLUSTER_NAME: avm-ci
          CASSANDRA_DC: dc1
          CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
          MAX_HEAP_SIZE: 1G
          HEAP_NEWSIZE: 256M
        ports: ["9042:9042"]
        options: >-
          --health-cmd "cqlsh -e 'describe cluster' localhost 9042"
          --health-interval 15s --health-timeout 10s --health-retries 30
    env:
      # Network tests run in their own job.
      AVM_SKIP_LIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore AvmBalanceIndexer.slnx
      - run: dotnet build AvmBalanceIndexer.slnx -c Release --no-restore
      - run: dotnet test AvmBalanceIndexer.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults

  live-network:
    name: Live network (first 1000 rounds)
    runs-on: ubuntu-latest
    timeout-minutes: 45 # a normal run takes 5-8 minutes; a stuck public node must not hold the runner for hours
    needs: build-test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: avm_indexer
          POSTGRES_USER: avm
          POSTGRES_PASSWORD: avm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avm -d avm_indexer"
          --health-interval 5s --health-timeout 3s --health-retries 20
      cassandra:
        image: cassandra:5.0
        env:
          CASSANDRA_CLUSTER_NAME: avm-ci-live
          CASSANDRA_DC: dc1
          CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
          MAX_HEAP_SIZE: 1G
          HEAP_NEWSIZE: 256M
        ports: ["9042:9042"]
        options: >-
          --health-cmd "cqlsh -e 'describe cluster' localhost 9042"
          --health-interval 15s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Indexes the first 1000 rounds of Algorand TestNet and MainNet from public archival nodes into PostgreSQL and into
      # Cassandra and compares every balance with the ledger state deltas published by a public algod.
      - run: dotnet test tests/AvmBalanceIndexer.Live.Tests -c Release --logger "trx;LogFileName=live.trx" --results-directory TestResults --logger "console;verbosity=normal" --blame-hang-timeout 15m --blame-hang-dump-type mini
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-test-results
          path: TestResults

  docker:
    name: Docker build (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        component: [api, worker]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.component }}
          push: false
          tags: avm-balance-indexer/${{ matrix.component }}:ci
          build-args: BUILD_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: VERSION is major.minor (image tags, release tags v<VERSION>.N)
        run: grep -Eq '^[0-9]+\.[0-9]+$' VERSION
      - uses: azure/setup-helm@v5
      - run: |
          for v in deploy/helm/values/*.yaml; do
            echo "== $v"
            helm lint deploy/helm/avm-balance-indexer -f "$v" --set cassandra.embedded.node=ci-node
            helm template ci deploy/helm/avm-balance-indexer -f "$v" --set cassandra.embedded.node=ci-node > /dev/null
          done
      - name: Upgrade options render (per-component tags, Recreate strategy, invalid strategy refused)
        run: |
          out=$(helm template ci deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml \
            --set cassandra.embedded.node=ci-node --set image.apiTag=old-api --set image.workerTag=new-worker --set worker.strategy=Recreate)
          echo "$out" | grep -q 'image: .*-api:old-api'
          echo "$out" | grep -q 'image: .*-worker:new-worker'
          echo "$out" | grep -q 'type: Recreate'
          if helm template ci deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=ci-node --set worker.strategy=recreate > /dev/null 2>&1; then
            echo "an invalid worker.strategy must fail the render"; exit 1
          fi
          helm template ci deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=ci-node --set api.pathBase=/avm-testnet | grep -q 'Api__PathBase: "/avm-testnet"'
          for bad in /avm-testnet/ /.. /a/. avm-testnet; do
            if helm template ci deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=ci-node --set "api.pathBase=$bad" > /dev/null 2>&1; then
              echo "the pathBase '$bad' must fail the render"; exit 1
            fi
          done
      - name: Database change requests render (retired keyspaces reach the worker, the active keyspace is refused, snapshot expiry)
        run: |
          t() { helm template ci deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=ci-node "$@"; }
          t | grep -q 'Storage__Cassandra__RetiredKeyspaceQuietMinutes: "60"'
          out=$(t --set storage.cassandra.keyspace=avm_new --set "storage.cassandra.retiredKeyspaces={avm_old_1,avm_old_2}" --set cassandra.embedded.autoSnapshotTtl=7d --set storage.cassandra.retiredKeyspaceQuietMinutes=240)
          echo "$out" | grep -q 'Storage__Cassandra__RetiredKeyspaceQuietMinutes: "240"'
          # The worker-only settings are env entries of the worker deployment (name and value on two lines), not part of the shared ConfigMap.
          worker() { t -s templates/worker-deployment.yaml "$@"; }
          api() { t -s templates/api-deployment.yaml "$@"; }
          has() { grep -A1 "name: $2\$" <<< "$1" | grep -q "value: \"$3\""; } # output, name, value
          has "$(worker --set storage.cassandra.keyspace=avm_new --set "storage.cassandra.retiredKeyspaces={avm_old_1,avm_old_2}")" Storage__Cassandra__RetiredKeyspaces__0 avm_old_1
          has "$(worker --set storage.cassandra.keyspace=avm_new --set "storage.cassandra.retiredKeyspaces={avm_old_1,avm_old_2}")" Storage__Cassandra__RetiredKeyspaces__1 avm_old_2
          if api --set storage.cassandra.keyspace=avm_new --set "storage.cassandra.retiredKeyspaces={avm_old_1}" | grep -q RetiredKeyspaces; then echo "the API must not get the retired keyspaces"; exit 1; fi
          echo "$out" | grep -q 'auto_snapshot_ttl: 7d/'
          echo "$out" | grep -q 'exec docker-entrypoint.sh cassandra -f'
          # A missing setting must never keep Cassandra from starting: the check only warns, the exec is unconditional.
          if echo "$out" | grep -q '&& exec docker-entrypoint'; then echo "the Cassandra start must not depend on the sed"; exit 1; fi
          # The keyspace and datacenter themselves: a block scalar (`|`) keeps a trailing newline, which the options validation refuses.
          printf 'storage:\n  cassandra:\n    keyspace: |\n      avm_x\n' > /tmp/newline-keyspace.yaml
          refused() { # expected words, helm arguments...: the render must fail with a message containing the words
            local words="$1"; shift
            if err="$(t "$@" 2>&1 >/dev/null)"; then echo "must fail the render: $*"; exit 1; fi
            grep -q "$words" <<< "$err" || { echo "failed for another reason: $err"; exit 1; }
          }
          refused 'storage.cassandra.keyspace' -f /tmp/newline-keyspace.yaml
          refused 'storage.cassandra.keyspace' --set storage.cassandra.keyspace=1bad
          refused 'storage.cassandra.keyspace' --set storage.cassandra.keyspace=bad-name
          refused 'storage.cassandra.localDatacenter' --set "storage.cassandra.localDatacenter=dc'1"
          # Partial rebuild (ADR 0021): forkFrom reaches the worker only, the API keeps reading apiKeyspace and refuses new scans meanwhile.
          fork=(--set storage.cassandra.keyspace=avm_new --set storage.cassandra.forkFrom.keyspace=avm_old --set storage.cassandra.forkFrom.round=1234567 --set storage.cassandra.forkFrom.into=avm_new)
          w="$(worker "${fork[@]}" --set storage.cassandra.apiKeyspace=avm_old)"
          has "$w" Storage__Cassandra__ForkFrom__Keyspace avm_old
          has "$w" Storage__Cassandra__ForkFrom__Round 1234567
          has "$w" Storage__Cassandra__ForkFrom__Into avm_new
          has "$w" Storage__Cassandra__ApiKeyspace avm_old
          a="$(api "${fork[@]}" --set storage.cassandra.apiKeyspace=avm_old)"
          has "$a" Storage__Cassandra__Keyspace avm_old
          has "$a" Api__ScansEnabled false
          if grep -q ForkFrom <<< "$a"; then echo "the API must not get forkFrom"; exit 1; fi
          if t "${fork[@]}" | grep -A3 'name: Api__ScansEnabled' | grep -q false; then echo "scans must stay on without apiKeyspace"; exit 1; fi
          if t | grep -q 'ForkFrom'; then echo "no forkFrom by default"; exit 1; fi
          t --set storage.cassandra.forkFrom=null > /dev/null # a request that is removed from the values is not an error
          refused 'forkFrom.keyspace' --set storage.cassandra.keyspace=avm_new --set storage.cassandra.forkFrom.keyspace=AVM_NEW --set storage.cassandra.forkFrom.round=5 --set storage.cassandra.forkFrom.into=avm_new
          refused 'forkFrom.keyspace' --set storage.cassandra.keyspace=avm_new --set storage.cassandra.forkFrom.keyspace=system_auth --set storage.cassandra.forkFrom.round=5 --set storage.cassandra.forkFrom.into=avm_new
          refused 'forkFrom.keyspace' --set storage.cassandra.keyspace=avm_new --set storage.cassandra.forkFrom.keyspace=bad-name --set storage.cassandra.forkFrom.round=5 --set storage.cassandra.forkFrom.into=avm_new
          refused 'retiredKeyspaces' --set storage.cassandra.keyspace=avm_new --set storage.cassandra.forkFrom.keyspace=avm_old --set storage.cassandra.forkFrom.round=5 --set storage.cassandra.forkFrom.into=avm_new --set "storage.cassandra.retiredKeyspaces={avm_old}"
          for round in 0 -3 1.5; do
            refused 'forkFrom.round' --set storage.cassandra.keyspace=avm_new --set storage.cassandra.forkFrom.keyspace=avm_old --set "storage.cassandra.forkFrom.round=$round" --set storage.cassandra.forkFrom.into=avm_new
          done
          refused 'forkFrom.into' --set storage.cassandra.keyspace=avm_new --set storage.cassandra.forkFrom.keyspace=avm_old --set storage.cassandra.forkFrom.round=5
          refused 'forkFrom.into' --set storage.cassandra.keyspace=avm_new --set storage.cassandra.forkFrom.keyspace=avm_old --set storage.cassandra.forkFrom.round=5 --set storage.cassandra.forkFrom.into=avm_other
          refused 'the keyspace the API reads' --set storage.cassandra.keyspace=avm_new --set storage.cassandra.apiKeyspace=avm_old --set "storage.cassandra.retiredKeyspaces={avm_old}"
          refused 'apiKeyspace' --set storage.cassandra.apiKeyspace=bad-name
          for provider_case in forkFrom apiKeyspace; do
            if [ "$provider_case" = forkFrom ]; then extra=(--set storage.cassandra.forkFrom.keyspace=avm_old --set storage.cassandra.forkFrom.round=5 --set storage.cassandra.forkFrom.into=avm_indexer); else extra=(--set storage.cassandra.apiKeyspace=avm_old); fi
            if helm template ci deploy/helm/avm-balance-indexer --set storage.provider=PostgreSql --set storage.postgreSql.existingSecret=x "${extra[@]}" > /dev/null 2>&1; then
              echo "$provider_case for a PostgreSQL release must fail the render"; exit 1
            fi
          done
          # A PostgreSQL release never reads the Cassandra settings, so they are not checked there.
          helm template ci deploy/helm/avm-balance-indexer --set storage.provider=PostgreSql --set storage.postgreSql.existingSecret=x --set storage.cassandra.localDatacenter= > /dev/null
          # What the worker's options validation refuses must already fail the render: a pod that cannot start stops indexing.
          for bad in AVM_New avm-old system_auth System 1old; do
            if t --set storage.cassandra.keyspace=avm_new --set "storage.cassandra.retiredKeyspaces={$bad}" > /dev/null 2>&1; then
              echo "the retired keyspace '$bad' must fail the render"; exit 1
            fi
          done
          if helm template ci deploy/helm/avm-balance-indexer --set storage.provider=PostgreSql --set storage.postgreSql.existingSecret=x --set "storage.cassandra.retiredKeyspaces={avm_old}" > /dev/null 2>&1; then
            echo "retired keyspaces for a PostgreSQL release must fail the render"; exit 1
          fi
          if t --set cassandra.embedded.autoSnapshotTtl=7days > /dev/null 2>&1; then
            echo "an invalid autoSnapshotTtl must fail the render"; exit 1
          fi
          if t --set cassandra.embedded.autoSnapshotTtl= | grep -q 'auto_snapshot_ttl'; then
            echo "an empty autoSnapshotTtl must leave the Cassandra start command alone"; exit 1
          fi
      - name: Alert rules render, are valid and fire as tested
        run: deploy/helm/ci/alerts.sh
      - name: API autoscaling renders (opt-in, no replica count on the Deployment, invalid combinations refused)
        run: |
          t() { helm template ci deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=ci-node "$@"; }
          api='select(.kind == "Deployment" and .metadata.labels."app.kubernetes.io/component" == "api")'
          # Off by default: no autoscaler, the configured replica count.
          out=$(t)
          if grep -q "kind: HorizontalPodAutoscaler" <<< "$out"; then echo "autoscaling must be off by default"; exit 1; fi
          test "$(yq "$api | .spec.replicas" <<< "$out")" = 1
          # On: an autoscaler for the API Deployment, and no replica count that every upgrade would reset.
          out=$(t --set api.autoscaling.enabled=true --set api.autoscaling.minReplicas=2 --set api.autoscaling.maxReplicas=5)
          test "$(echo "$out" | yq 'select(.kind == "HorizontalPodAutoscaler") | .spec.scaleTargetRef.name')" = "ci-algorand-testnet-api"
          test "$(echo "$out" | yq 'select(.kind == "HorizontalPodAutoscaler") | .spec.maxReplicas')" = 5
          test "$(echo "$out" | yq "$api | .spec.replicas")" = null
          refused() { # words, arguments...
            local words="$1"; shift
            if err="$(t "$@" 2>&1 >/dev/null)"; then echo "must fail the render: $*"; exit 1; fi
            grep -q "$words" <<< "$err" || { echo "failed for another reason: $err"; exit 1; }
          }
          refused 'must not be greater' --set api.autoscaling.enabled=true --set api.autoscaling.minReplicas=5 --set api.autoscaling.maxReplicas=2
          refused 'greater than api.podDisruptionBudget.minAvailable' --set api.autoscaling.enabled=true --set api.autoscaling.minReplicas=1
          refused 'whole number' --set api.autoscaling.enabled=true --set api.autoscaling.targetCPUUtilizationPercentage=0
          refused 'whole number' --set api.autoscaling.enabled=true --set api.autoscaling.targetCPUUtilizationPercentage=70.5
          refused 'requests.cpu' --set api.autoscaling.enabled=true --set api.resources=null
          refused 'greater than api.podDisruptionBudget.minAvailable' --set api.autoscaling.enabled=true --set api.autoscaling.minReplicas=2 --set api.podDisruptionBudget.minAvailable=2
          # A target above 100 is valid (utilization is relative to the request).
          grep -q "averageUtilization: 150" <<< "$(t --set api.autoscaling.enabled=true --set api.autoscaling.targetCPUUtilizationPercentage=150)"
          refused 'requests.cpu' --set api.autoscaling.enabled=true --set api.resources.requests.cpu=null --set api.resources.limits.cpu=null
          refused 'whole number of replicas' --set api.autoscaling.enabled=true --set api.autoscaling.minReplicas=2.5
          # A CPU limit alone is enough: Kubernetes takes the request from it.
          grep -q "kind: HorizontalPodAutoscaler" <<< "$(t --set api.autoscaling.enabled=true --set api.resources.requests.cpu=null)"
          # One replica is allowed without the PodDisruptionBudget.
          grep -q "minReplicas: 1" <<< "$(t --set api.autoscaling.enabled=true --set api.autoscaling.minReplicas=1 --set api.podDisruptionBudget.enabled=false)"
      - name: Deployment overlays render (hostPath, ingress host, embedded Cassandra contact point)
        run: |
          check() { # overlay release hostPath host
            out=$(helm template "$2" deploy/helm/avm-balance-indexer -f "deploy/helm/values/$1.yaml" --set image.repository=docker.io/acme/avm-balance-indexer --set image.tag=t1 --set cassandra.embedded.node=node-1)
            echo "$out" | grep -q "path: \"$3\"" || { echo "$1: hostPath $3 missing"; exit 1; }
            echo "$out" | grep -q "host: \"$4\"" || { echo "$1: ingress host $4 missing"; exit 1; }
            echo "$out" | grep -q "kubernetes.io/ingress.class: nginx" || { echo "$1: ingress class annotation missing"; exit 1; }
            echo "$out" | grep -q "cert-manager.io/cluster-issuer: letsencrypt-dns" || { echo "$1: cluster issuer annotation missing"; exit 1; }
            echo "$out" | grep -q "image: docker.io/acme/avm-balance-indexer-api:t1" || { echo "$1: api image name wrong"; exit 1; }
            echo "$out" | grep -q "Storage__Cassandra__ContactPoints__0: \"$2-.*-cassandra\"" || { echo "$1: contact point missing"; exit 1; }
            if echo "$out" | grep -q "Storage__Cassandra__Password"; then echo "$1: embedded Cassandra must not need a secret"; exit 1; fi
          }
          check stage-testnet testnet /mnt/nvme1/avm-balance-indexer/testnet testnet.balance-indexer.biatec.io
          check prod-algorand mainnet /mnt/nvme1/avm-balance-indexer/mainnet mainnet.balance-indexer.biatec.io
          check prod-voi voi /mnt/nvme1/avm-balance-indexer/voi voi.balance-indexer.biatec.io
          out=$(helm template x deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=node-1)
          echo "$out" | grep -q 'kubernetes.io/hostname: "node-1"' || { echo "the node selector is missing"; exit 1; }
          out=$(helm template x deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=node-1 --set networkPolicy.enabled=false)
          if echo "$out" | grep -q "kind: NetworkPolicy"; then echo "networkPolicy.enabled=false must render no NetworkPolicy"; exit 1; fi
          echo "$out" | grep -q "kind: Deployment" || { echo "the deployments must still render"; exit 1; }
          if echo "$out" | grep -q "kind: StatefulSet"; then echo "the chart must not need StatefulSet rights"; exit 1; fi
          out=$(helm template x deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=node-1 --set api.podDisruptionBudget.enabled=false)
          if echo "$out" | grep -q "kind: PodDisruptionBudget"; then echo "api.podDisruptionBudget.enabled=false must render no PodDisruptionBudget"; exit 1; fi
          if helm template x deploy/helm/avm-balance-indexer --set cassandra.embedded.enabled=true --set storage.provider=Cassandra --set cassandra.embedded.node=n > /dev/null 2>&1; then
            echo "the embedded Cassandra without a hostPath must fail the render"; exit 1
          fi
          if helm template x deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml --set cassandra.embedded.node=n --set storage.cassandra.replicationFactor=3 > /dev/null 2>&1; then
            echo "the embedded Cassandra with replication factor 3 must fail the render"; exit 1
          fi
          if helm template x deploy/helm/avm-balance-indexer -f deploy/helm/values/stage-testnet.yaml > /dev/null 2>&1; then
            echo "the embedded Cassandra without a node must fail the render"; exit 1
          fi
