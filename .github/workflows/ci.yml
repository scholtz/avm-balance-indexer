name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore AvmBalanceIndexer.slnx
      - run: dotnet build AvmBalanceIndexer.slnx -c Release --no-restore
      - run: dotnet test AvmBalanceIndexer.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  storage-contract:
    name: Storage contract (${{ matrix.provider }})
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        provider: [PostgreSql, Cassandra]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: avm_indexer
          POSTGRES_USER: avm
          POSTGRES_PASSWORD: avm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avm -d avm_indexer"
          --health-interval 5s --health-timeout 3s --health-retries 20
      cassandra:
        image: cassandra:5.0
        env:
          MAX_HEAP_SIZE: 1G
          HEAP_NEWSIZE: 256M
        ports: ["9042:9042"]
        options: >-
          --health-cmd "cqlsh -e 'describe cluster' localhost 9042"
          --health-interval 15s --health-timeout 10s --health-retries 30
    env:
      Storage__Provider: ${{ matrix.provider }}
      Storage__PostgreSql__ConnectionString: Host=localhost;Port=5432;Database=avm_indexer;Username=avm;Password=avm
      Storage__Cassandra__ContactPoints__0: localhost
      Storage__Cassandra__Keyspace: avm_indexer_ci
      Storage__Cassandra__LocalDatacenter: datacenter1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/AvmBalanceIndexer.Storage.ContractTests -c Release

  docker:
    name: Docker build (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        component: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.component }}
          push: false
          tags: avm-balance-indexer/${{ matrix.component }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          for v in deploy/helm/values/*.yaml; do
            echo "== $v"
            helm lint deploy/helm/avm-balance-indexer -f "$v"
            helm template ci deploy/helm/avm-balance-indexer -f "$v" > /dev/null
          done
