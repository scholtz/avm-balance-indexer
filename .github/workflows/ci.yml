name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Tests use this server instead of starting a container of their own.
  AVM_TEST_POSTGRES: Host=localhost;Port=5432;Database=avm_indexer;Username=avm;Password=avm

jobs:
  build-test:
    name: Build, unit and storage contract tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: avm_indexer
          POSTGRES_USER: avm
          POSTGRES_PASSWORD: avm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avm -d avm_indexer"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Network tests run in their own job.
      AVM_SKIP_LIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore AvmBalanceIndexer.slnx
      - run: dotnet build AvmBalanceIndexer.slnx -c Release --no-restore
      - run: dotnet test AvmBalanceIndexer.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  live-network:
    name: Live network (first 1000 rounds)
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: avm_indexer
          POSTGRES_USER: avm
          POSTGRES_PASSWORD: avm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avm -d avm_indexer"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Indexes the first 1000 rounds of Algorand TestNet and MainNet from public archival nodes into PostgreSQL and
      # compares every balance with the ledger state deltas published by a public algod.
      - run: dotnet test tests/AvmBalanceIndexer.Live.Tests -c Release --logger "trx;LogFileName=live.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-test-results
          path: TestResults

  docker:
    name: Docker build (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        component: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.component }}
          push: false
          tags: avm-balance-indexer/${{ matrix.component }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - run: |
          for v in deploy/helm/values/*.yaml; do
            echo "== $v"
            helm lint deploy/helm/avm-balance-indexer -f "$v"
            helm template ci deploy/helm/avm-balance-indexer -f "$v" > /dev/null
          done
