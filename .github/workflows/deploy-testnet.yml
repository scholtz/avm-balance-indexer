name: Deploy testnet

# Every push to main that passes CI builds the images, pushes them to Docker Hub and upgrades the release `testnet`
# (algorand-testnet on Cassandra, https://testnet.balance-indexer.biatec.io). Run it by hand to redeploy a commit.
# See docs/deployment-pipelines.md for the secrets this needs.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to deploy (default is the head of main)
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: Choose the commit
    runs-on: ubuntu-latest
    # CI must have passed on a push to main; a manual run is the way to deploy anyway.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      tag: ${{ steps.sha.outputs.tag }}
      version: ${{ steps.sha.outputs.version }}
      current: ${{ steps.sha.outputs.current }}
    steps:
      - id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.ref }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="${RUN_SHA:-}"
          if [ -z "$sha" ]; then
            ref="${REQUESTED:-main}"
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${ref}" --jq .sha)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # <VERSION file>-abi-<UTC date>-<short commit>, for example 1.0-abi-2026-10-13-abcdef1
          version="$(gh api "repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=${sha}" --jq .content | base64 -d | tr -d '[:space:]')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must hold major.minor, found '${version}'"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${version}-abi-$(date -u +%F)-${sha:0:7}" >> "$GITHUB_OUTPUT"
          # A slower CI run of an older commit must not roll the testnet back: only the head of main is deployed.
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$sha" = "$head" ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$sha is not the head of main ($head); a newer run deploys it"
          fi

  images:
    name: Images
    needs: plan
    if: needs.plan.outputs.current == 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.tag }}
      tags: |
        ${{ needs.plan.outputs.tag }}
        testnet
    secrets: inherit

  deploy:
    name: Testnet
    needs: [plan, images]
    if: needs.plan.outputs.current == 'true'
    uses: ./.github/workflows/helm-deploy.yml
    with:
      environment: testnet
      ref: ${{ needs.plan.outputs.sha }}
      release: testnet
      values: stage-testnet.yaml
      chain: algorand-testnet
      secret-suffix: TESTNET
      host: testnet.balance-indexer.biatec.io
      image-tag: ${{ needs.plan.outputs.tag }}
      require-head-of-main: ${{ github.event_name != 'workflow_dispatch' }}
    secrets: inherit
