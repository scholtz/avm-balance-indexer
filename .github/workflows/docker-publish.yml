name: Publish images

# Builds the API and worker images and pushes them to Docker Hub as
#   <DOCKERHUB_USERNAME>/avm-balance-indexer-api and <DOCKERHUB_USERNAME>/avm-balance-indexer-worker.
# Called by deploy-testnet.yml and deploy-production.yml; see docs/deployment-pipelines.md.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true
      version:
        description: Full version string, stored as the image label org.opencontainers.image.version
        type: string
        required: true
      tags:
        description: Image tags to push, one per line
        type: string
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  push:
    name: Push ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component: [api, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Image names
        id: names
        env:
          USER_NAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TAGS: ${{ inputs.tags }}
          COMPONENT: ${{ matrix.component }}
        run: |
          {
            echo "list<<EOF"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "docker.io/${USER_NAME}/avm-balance-indexer-${COMPONENT}:${tag}"
            done <<< "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The first tag is the immutable one. When it exists already (testnet built this commit before the release tag) the other tags are put on that
      # image instead of building again, so the bits that ran on testnet are the bits that go to production.
      - name: Image of this commit already built?
        id: existing
        env:
          NAMES: ${{ steps.names.outputs.list }}
        run: |
          first="$(head -n1 <<< "$NAMES")"
          if docker buildx imagetools inspect "$first" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            args=(); while IFS= read -r name; do [ -n "$name" ] && [ "$name" != "$first" ] && args+=(-t "$name"); done <<< "$NAMES"
            if [ ${#args[@]} -gt 0 ]; then docker buildx imagetools create "${args[@]}" "$first"; fi
          fi
      - uses: docker/build-push-action@v7
        if: steps.existing.outputs.found != 'true'
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
