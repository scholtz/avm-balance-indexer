name: Helm deploy

# Installs or upgrades one release of the chart in the namespace avm-balance-indexer, using the kube config in the secret KUBE_CONFIG.
# Called by deploy-testnet.yml and deploy-production.yml; see docs/deployment-pipelines.md.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment named like the release (testnet, mainnet or voi); environment secrets override repository secrets
        type: string
        required: true
      ref:
        description: Commit whose chart is deployed
        type: string
        required: true
      release:
        description: Helm release name (testnet, mainnet, voi)
        type: string
        required: true
      values:
        description: Values overlay in deploy/helm/values
        type: string
        required: true
      chain:
        type: string
        required: true
      host:
        description: Public host name of the API, used for the smoke test
        type: string
        required: true
      image-tag:
        description: Tag of the images to run
        type: string
        required: true
      secret-suffix:
        description: Suffix of the optional per-chain algod settings (TESTNET, MAINNET or VOI)
        type: string
        required: true
      require-head-of-main:
        description: Refuse to deploy when ref is no longer the head of main (an older run must not roll back a newer one)
        type: boolean
        default: false
    secrets:
      KUBE_CONFIG:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PULL_TOKEN:
        required: false
      CASSANDRA_NODE:
        required: false
      ALGOD_TOKEN_TESTNET:
        required: false
      ALGOD_TOKEN_MAINNET:
        required: false
      ALGOD_TOKEN_VOI:
        required: false
      ALGOD_URL_TESTNET:
        required: false
      ALGOD_URL_MAINNET:
        required: false
      ALGOD_URL_VOI:
        required: false

permissions:
  contents: read

env:
  NAMESPACE: avm-balance-indexer

jobs:
  guard:
    name: Is this still wanted?
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.head.outputs.go }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref }}
          REQUIRE_HEAD: ${{ inputs.require-head-of-main }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$REQUIRE_HEAD" = true ] && [ "$head" != "$SHA" ]; then
            echo "::notice::$SHA is no longer the head of main ($head); the newer run deploys"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy ${{ inputs.release }}
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Two deployments of one release must not run at the same time; a newer one waits instead of cancelling a running upgrade.
    concurrency:
      group: deploy-${{ inputs.release }}
      cancel-in-progress: false
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: azure/setup-helm@v5
      - uses: azure/setup-kubectl@v5
      - name: Kube config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          # The secret may hold the YAML itself or its base64 encoding.
          if printf '%s' "$KUBE_CONFIG" | grep -q 'apiVersion:'; then
            printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          else
            printf '%s' "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          fi
          chmod 600 ~/.kube/config
          # Needs cluster rights; with a namespace-scoped kube config the namespace has to exist already.
          if ! kubectl -n "$NAMESPACE" get pods > /dev/null 2>&1 && [ "$(kubectl auth can-i create namespaces)" = yes ]; then
            kubectl create namespace "$NAMESPACE"
          fi
          kubectl -n "$NAMESPACE" get pods > /dev/null
      # The kube config may belong to a restricted account: say exactly which rights are missing before Helm fails half way.
      - name: Check the permissions of the kube config
        env:
          RELEASE: ${{ inputs.release }}
          CHAIN: ${{ inputs.chain }}
        run: |
          # can-i answers yes or no; anything else (a flaky API server) stops the job instead of being read as "no".
          can() {
            local answer
            answer="$(kubectl -n "$NAMESPACE" auth can-i "$1" "$2" 2>/dev/null)" || [ "$answer" = no ] || { echo "::error::Could not ask the cluster whether the kube config may $1 $2"; exit 1; }
            [ "$answer" = yes ]
          }
          missing=()
          for resource in deployments.apps services configmaps secrets ingresses.networking.k8s.io; do
            for verb in get list watch create update patch; do
              can "$verb" "$resource" || missing+=("$verb $resource")
            done
            # Helm deletes only objects that left the chart and when it rolls a failed upgrade back to a fresh install.
            can delete "$resource" || echo "::warning::The kube config may not delete $resource: a failed first install or a removed object has to be cleaned up by hand"
          done
          for resource in pods replicasets.apps; do
            for verb in get list watch; do
              can "$verb" "$resource" || missing+=("$verb $resource")
            done
          done
          if [ ${#missing[@]} -gt 0 ]; then
            for item in "${missing[@]}"; do echo "::error::The kube config may not $item"; done
            echo "::error::Grant these in the namespace ${NAMESPACE} (deploy/rbac/deployer.yaml lists everything the chart needs)"; exit 1
          fi
          # The PodDisruptionBudget only protects the API during node drains.
          for verb in get list watch create update patch; do
            if ! can "$verb" poddisruptionbudgets.policy; then
              echo "::warning::No right to $verb poddisruptionbudgets: deploying without the API PodDisruptionBudget"
              echo "PDB=false" >> "$GITHUB_ENV"; break
            fi
          done
          # The NetworkPolicy that shields Cassandra is a protection, not a requirement: without the right to manage it a new release is installed without it.
          # An existing policy is never dropped silently, that would open port 9042.
          for verb in get list watch create update patch delete; do
            if ! can "$verb" networkpolicies.networking.k8s.io; then
              if kubectl -n "$NAMESPACE" get networkpolicy "${RELEASE}-${CHAIN}-cassandra" > /dev/null 2>&1; then
                echo "::error::The release has a Cassandra NetworkPolicy but the kube config may not $verb networkpolicies; grant it (deploy/rbac/deployer.yaml)"; exit 1
              fi
              echo "::warning::No right to $verb networkpolicies: deploying without the Cassandra NetworkPolicy; anything in the namespace can reach port 9042"
              echo "NETWORK_POLICY=false" >> "$GITHUB_ENV"; break
            fi
          done
      # Every Kubernetes secret the release needs is created here from GitHub secrets: nothing is edited in the cluster by hand.
      - name: Kubernetes secrets
        env:
          RELEASE: ${{ inputs.release }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
          ALGOD_TOKEN: ${{ secrets[format('ALGOD_TOKEN_{0}', inputs.secret-suffix)] }}
          ALGOD_URL: ${{ vars[format('ALGOD_URL_{0}', inputs.secret-suffix)] || secrets[format('ALGOD_URL_{0}', inputs.secret-suffix)] }}
        run: |
          # Server-side apply keeps the secret out of the last-applied-configuration annotation.
          apply() { kubectl -n "$NAMESPACE" apply --server-side --force-conflicts -f -; }
          # Only for private Docker Hub repositories: GitHub secret DOCKERHUB_PULL_TOKEN, a read-only access token.
          if [ -n "$PULL_TOKEN" ]; then
            kubectl -n "$NAMESPACE" create secret docker-registry "${RELEASE}-dockerhub-pull" \
              --docker-server=https://index.docker.io/v1/ --docker-username="$DOCKERHUB_USERNAME" --docker-password="$PULL_TOKEN" \
              --dry-run=client -o yaml | apply
          fi
          # Token of the algod node when it needs one (GitHub secret ALGOD_TOKEN_TESTNET / _MAINNET / _VOI); the chart is told about it below.
          if [ -n "$ALGOD_TOKEN" ]; then
            if [ -z "$ALGOD_URL" ]; then
              echo "::error::ALGOD_TOKEN is set but the Actions variable (or secret) ALGOD_URL_<chain> is not: the token would be sent to the public endpoint"; exit 1
            fi
            kubectl -n "$NAMESPACE" create secret generic "${RELEASE}-algod" --from-literal=token="$ALGOD_TOKEN" --dry-run=client -o yaml | apply
          fi
      - name: Upgrade the release
        env:
          ALGOD_TOKEN: ${{ secrets[format('ALGOD_TOKEN_{0}', inputs.secret-suffix)] }}
          ALGOD_URL: ${{ vars[format('ALGOD_URL_{0}', inputs.secret-suffix)] || secrets[format('ALGOD_URL_{0}', inputs.secret-suffix)] }}
          PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
          RELEASE: ${{ inputs.release }}
          VALUES: ${{ inputs.values }}
          CHAIN: ${{ inputs.chain }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          CASSANDRA_NODE: ${{ vars.CASSANDRA_NODE || secrets.CASSANDRA_NODE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then echo "::error::Invalid image tag"; exit 1; fi
          if [ -z "$CASSANDRA_NODE" ]; then
            echo "::error::Set the Actions variable (or secret) CASSANDRA_NODE to the name of the node that owns /mnt/nvme1/avm-balance-indexer (docs/deployment-pipelines.md)"; exit 1
          fi
          common=(--namespace "$NAMESPACE" -f "deploy/helm/values/$VALUES"
            --set-string "image.repository=docker.io/${DOCKERHUB_USERNAME}/avm-balance-indexer"
            --set-string "cassandra.embedded.node=$CASSANDRA_NODE" --atomic --timeout 25m)
          if [ "${NETWORK_POLICY:-true}" = false ]; then common+=(--set networkPolicy.enabled=false); fi
          if [ "${PDB:-true}" = false ]; then common+=(--set api.podDisruptionBudget.enabled=false); fi
          # Pods restart when a secret changes: its hash is part of the pod template.
          if [ -n "$PULL_TOKEN" ]; then common+=(--set "imagePullSecrets[0].name=${RELEASE}-dockerhub-pull"); fi
          if [ -n "$ALGOD_TOKEN" ]; then common+=(--set-string "algorand.existingSecret=${RELEASE}-algod"); fi
          common+=(--set-string "secretsChecksum=$(printf '%s|%s' "$ALGOD_TOKEN" "$PULL_TOKEN" | sha256sum | cut -c1-16)")
          if [ -n "$ALGOD_URL" ]; then common+=(--set-string "algorand.algodUrl=$ALGOD_URL"); fi

          # Upgrade rules of docs/operations.md: the worker first (it applies schema changes; Recreate so that no old writer runs meanwhile),
          # the API only after the new worker is ready. A first installation has nothing to protect and goes in one step.
          api_image="$(kubectl -n "$NAMESPACE" get deployment "${RELEASE}-${CHAIN}-api" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          if [ -n "$api_image" ] && [ "${api_image##*:}" != "$IMAGE_TAG" ]; then
            echo "Step 1: worker ${IMAGE_TAG}, API stays on ${api_image##*:}"
            helm upgrade --install "$RELEASE" deploy/helm/avm-balance-indexer "${common[@]}" \
              --set-string "image.tag=$IMAGE_TAG" --set-string "image.apiTag=${api_image##*:}" --set worker.strategy=Recreate
          fi
          echo "Step 2: everything on ${IMAGE_TAG}"
          helm upgrade --install "$RELEASE" deploy/helm/avm-balance-indexer "${common[@]}" --set-string "image.tag=$IMAGE_TAG"
      - name: What runs
        if: always()
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          kubectl -n "$NAMESPACE" get pods,svc,ingress -l "app.kubernetes.io/instance=$RELEASE" -o wide || true
      - name: Smoke test
        env:
          HOST: ${{ inputs.host }}
          CHAIN: ${{ inputs.chain }}
        run: |
          # The ingress and its certificate can take a few minutes after the first install; a failure here is a warning, not a failed deployment.
          if curl -fsS --retry 12 --retry-delay 15 --retry-all-errors "https://${HOST}/v1/${CHAIN}/status"; then
            echo
          else
            echo "::warning::https://${HOST}/v1/${CHAIN}/status did not answer; check the ingress, DNS and the certificate"
          fi
