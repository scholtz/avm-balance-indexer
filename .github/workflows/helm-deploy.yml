name: Helm deploy

# Installs or upgrades one release of the chart in the namespace avm-balance-indexer, using the kube config in the secret KUBE_CONFIG.
# Called by deploy-testnet.yml and deploy-production.yml; see docs/deployment-pipelines.md.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment named like the release (testnet, mainnet or voi); environment secrets override repository secrets
        type: string
        required: true
      ref:
        description: Commit whose chart is deployed
        type: string
        required: true
      release:
        description: Helm release name (testnet, mainnet, voi)
        type: string
        required: true
      values:
        description: Values overlay in deploy/helm/values
        type: string
        required: true
      chain:
        type: string
        required: true
      host:
        description: Public host name of the API, used for the smoke test
        type: string
        required: true
      image-tag:
        description: Tag of the images to run
        type: string
        required: true
      secret-suffix:
        description: Suffix of the optional per-chain algod settings (TESTNET, MAINNET or VOI)
        type: string
        required: true
      require-head-of-main:
        description: Refuse to deploy when ref is no longer the head of main (an older run must not roll back a newer one)
        type: boolean
        default: false
    secrets:
      KUBE_CONFIG:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PULL_TOKEN:
        required: false
      CASSANDRA_NODE:
        required: false
      ALGOD_TOKEN_TESTNET:
        required: false
      ALGOD_TOKEN_MAINNET:
        required: false
      ALGOD_TOKEN_VOI:
        required: false
      ALGOD_URL_TESTNET:
        required: false
      ALGOD_URL_MAINNET:
        required: false
      ALGOD_URL_VOI:
        required: false

permissions:
  contents: read

env:
  NAMESPACE: avm-balance-indexer

jobs:
  guard:
    name: Is this still wanted?
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.head.outputs.go }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref }}
          REQUIRE_HEAD: ${{ inputs.require-head-of-main }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$REQUIRE_HEAD" = true ] && [ "$head" != "$SHA" ]; then
            echo "::notice::$SHA is no longer the head of main ($head); the newer run deploys"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy ${{ inputs.release }}
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Two deployments of one release must not run at the same time; a newer one waits instead of cancelling a running upgrade.
    concurrency:
      group: deploy-${{ inputs.release }}
      cancel-in-progress: false
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: azure/setup-helm@v5
      - uses: azure/setup-kubectl@v5
      - name: Kube config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          # The secret may hold the YAML itself or its base64 encoding.
          if printf '%s' "$KUBE_CONFIG" | grep -q 'apiVersion:'; then
            printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          else
            printf '%s' "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          fi
          chmod 600 ~/.kube/config
          # Needs cluster rights; with a namespace-scoped kube config the namespace has to exist already.
          if ! kubectl -n "$NAMESPACE" get pods > /dev/null 2>&1 && [ "$(kubectl auth can-i create namespaces)" = yes ]; then
            kubectl create namespace "$NAMESPACE"
          fi
          kubectl -n "$NAMESPACE" get pods > /dev/null
      # The kube config may belong to a restricted account: say exactly which rights are missing before Helm fails half way.
      - name: Check the permissions of the kube config
        env:
          RELEASE: ${{ inputs.release }}
          CHAIN: ${{ inputs.chain }}
          VALUES: ${{ inputs.values }}
        run: |
          # can-i answers yes or no; anything else (a flaky API server) stops the job instead of being read as "no".
          can() {
            local answer
            answer="$(kubectl -n "$NAMESPACE" auth can-i "$1" "$2" 2>/dev/null)" || [ "$answer" = no ] || { echo "::error::Could not ask the cluster whether the kube config may $1 $2"; exit 1; }
            [ "$answer" = yes ]
          }
          missing=()
          resources=(deployments.apps services configmaps secrets ingresses.networking.k8s.io)
          # The API autoscaler is opt-in per release (api.autoscaling.enabled). Its rights are needed when the values enable it, and to
          # delete it when they switch it off again (a missing delete right would fail the upgrade half way).
          hpa=no
          if [ "$(yq '.api.autoscaling.enabled // false' "deploy/helm/values/$VALUES")" = true ]; then
            hpa=yes
          elif can get horizontalpodautoscalers.autoscaling; then
            # Switched off (or never on): an autoscaler left from earlier is removed by this upgrade and recreated by its rollback.
            # Only "not found" means there is none; any other failure of the lookup is not an answer. An account that may not even read
            # autoscalers never created one (after a switch to such an account, remove a leftover autoscaler by hand).
            if probe="$(kubectl -n "$NAMESPACE" get horizontalpodautoscaler "${RELEASE}-${CHAIN}-api" -o name 2>&1)"; then
              hpa="yes (to remove it)"
            elif ! grep -q "NotFound" <<< "$probe"; then
              echo "::error::Could not tell whether the release has an API autoscaler to remove: $probe"; exit 1
            fi
          fi
          # Alert rules are opt-in too (alerts.enabled): they need the PrometheusRule rights and the Prometheus Operator CRD. When the values
          # switch them off while the release still has its rule, the upgrade deletes it (and a rollback recreates it): same rights.
          rules=no
          if [ "$(yq '.alerts.enabled // false' "deploy/helm/values/$VALUES")" = true ]; then
            # Discovery exits non-zero when any aggregated API group (metrics-server, ...) is down: the listing decides, the exit code only
            # explains a missing entry.
            crds="$(kubectl api-resources --api-group=monitoring.coreos.com -o name 2>&1)" && discovered=yes || discovered=no
            if ! grep -q '^prometheusrules' <<< "$crds"; then
              if [ "$discovered" = no ]; then echo "::error::Could not ask the cluster for the PrometheusRule CRD: $crds"; exit 1; fi
              echo "::error::alerts.enabled needs the PrometheusRule CRD of the Prometheus Operator in the cluster"; exit 1
            fi
            rules=yes
          elif can get prometheusrules.monitoring.coreos.com; then
            if probe="$(kubectl -n "$NAMESPACE" get prometheusrule "${RELEASE}-${CHAIN}-alerts" -o name 2>&1)"; then
              rules="yes (to remove them)"
            elif ! grep -q -e "NotFound" -e "the server doesn't have a resource type" <<< "$probe"; then
              echo "::error::Could not tell whether the release has alert rules to remove: $probe"; exit 1
            fi
          fi
          if [ "$rules" != no ]; then
            for verb in get list watch create update patch delete; do
              can "$verb" prometheusrules.monitoring.coreos.com || missing+=("$verb prometheusrules.monitoring.coreos.com")
            done
          fi
          if [ "$hpa" != no ]; then
            # All rights including delete: the --atomic rollback removes or recreates the autoscaler.
            for verb in get list watch create update patch delete; do
              can "$verb" horizontalpodautoscalers.autoscaling || missing+=("$verb horizontalpodautoscalers.autoscaling")
            done
          fi
          for resource in "${resources[@]}"; do
            for verb in get list watch create update patch; do
              can "$verb" "$resource" || missing+=("$verb $resource")
            done
            # Helm deletes only objects that left the chart and when it rolls a failed upgrade back to a fresh install.
            can delete "$resource" || echo "::warning::The kube config may not delete $resource: a failed first install or a removed object has to be cleaned up by hand"
          done
          for resource in pods replicasets.apps; do
            for verb in get list watch; do
              can "$verb" "$resource" || missing+=("$verb $resource")
            done
          done
          if [ ${#missing[@]} -gt 0 ]; then
            for item in "${missing[@]}"; do echo "::error::The kube config may not $item"; done
            echo "::error::Grant these in the namespace ${NAMESPACE} (deploy/rbac/deployer.yaml lists everything the chart needs)"; exit 1
          fi
          echo "API autoscaler in the values: $hpa"
          # The PodDisruptionBudget only protects the API during node drains.
          for verb in get list watch create update patch; do
            if ! can "$verb" poddisruptionbudgets.policy; then
              echo "::warning::No right to $verb poddisruptionbudgets: deploying without the API PodDisruptionBudget"
              echo "PDB=false" >> "$GITHUB_ENV"; break
            fi
          done
          # The NetworkPolicy that shields Cassandra is a protection, not a requirement: without the right to manage it a new release is installed without it.
          # An existing policy is never dropped silently, that would open port 9042.
          for verb in get list watch create update patch delete; do
            if ! can "$verb" networkpolicies.networking.k8s.io; then
              if kubectl -n "$NAMESPACE" get networkpolicy "${RELEASE}-${CHAIN}-cassandra" > /dev/null 2>&1; then
                echo "::error::The release has a Cassandra NetworkPolicy but the kube config may not $verb networkpolicies; grant it (deploy/rbac/deployer.yaml)"; exit 1
              fi
              echo "::warning::No right to $verb networkpolicies: deploying without the Cassandra NetworkPolicy; anything in the namespace can reach port 9042"
              echo "NETWORK_POLICY=false" >> "$GITHUB_ENV"; break
            fi
          done
      # Every Kubernetes secret the release needs is created here from GitHub secrets: nothing is edited in the cluster by hand.
      - name: Kubernetes secrets
        env:
          RELEASE: ${{ inputs.release }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
          ALGOD_TOKEN: ${{ secrets[format('ALGOD_TOKEN_{0}', inputs.secret-suffix)] }}
          ALGOD_URL: ${{ vars[format('ALGOD_URL_{0}', inputs.secret-suffix)] || secrets[format('ALGOD_URL_{0}', inputs.secret-suffix)] }}
        run: |
          # Server-side apply keeps the secret out of the last-applied-configuration annotation.
          apply() { kubectl -n "$NAMESPACE" apply --server-side --force-conflicts -f -; }
          # Only for private Docker Hub repositories: GitHub secret DOCKERHUB_PULL_TOKEN, a read-only access token.
          if [ -n "$PULL_TOKEN" ]; then
            kubectl -n "$NAMESPACE" create secret docker-registry "${RELEASE}-dockerhub-pull" \
              --docker-server=https://index.docker.io/v1/ --docker-username="$DOCKERHUB_USERNAME" --docker-password="$PULL_TOKEN" \
              --dry-run=client -o yaml | apply
          fi
          # Token of the algod node when it needs one (GitHub secret ALGOD_TOKEN_TESTNET / _MAINNET / _VOI); the chart is told about it below.
          if [ -n "$ALGOD_TOKEN" ]; then
            if [ -z "$ALGOD_URL" ]; then
              echo "::error::ALGOD_TOKEN is set but the Actions variable (or secret) ALGOD_URL_<chain> is not: the token would be sent to the public endpoint"; exit 1
            fi
            kubectl -n "$NAMESPACE" create secret generic "${RELEASE}-algod" --from-literal=token="$ALGOD_TOKEN" --dry-run=client -o yaml | apply
          fi
      - name: Upgrade the release
        env:
          ALGOD_TOKEN: ${{ secrets[format('ALGOD_TOKEN_{0}', inputs.secret-suffix)] }}
          ALGOD_URL: ${{ vars[format('ALGOD_URL_{0}', inputs.secret-suffix)] || secrets[format('ALGOD_URL_{0}', inputs.secret-suffix)] }}
          PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
          RELEASE: ${{ inputs.release }}
          VALUES: ${{ inputs.values }}
          CHAIN: ${{ inputs.chain }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          CASSANDRA_NODE: ${{ vars.CASSANDRA_NODE || secrets.CASSANDRA_NODE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then echo "::error::Invalid image tag"; exit 1; fi
          if [ -z "$CASSANDRA_NODE" ]; then
            echo "::error::Set the Actions variable (or secret) CASSANDRA_NODE to the name of the node that owns /mnt/nvme1/avm-balance-indexer (docs/deployment-pipelines.md)"; exit 1
          fi
          common=(--namespace "$NAMESPACE" -f "deploy/helm/values/$VALUES"
            --set-string "image.repository=docker.io/${DOCKERHUB_USERNAME}/avm-balance-indexer"
            --set-string "cassandra.embedded.node=$CASSANDRA_NODE" --atomic --timeout 25m)
          if [ "${NETWORK_POLICY:-true}" = false ]; then common+=(--set networkPolicy.enabled=false); fi
          if [ "${PDB:-true}" = false ]; then common+=(--set api.podDisruptionBudget.enabled=false); fi
          # Pods restart when a secret changes: its hash is part of the pod template.
          if [ -n "$PULL_TOKEN" ]; then common+=(--set "imagePullSecrets[0].name=${RELEASE}-dockerhub-pull"); fi
          if [ -n "$ALGOD_TOKEN" ]; then common+=(--set-string "algorand.existingSecret=${RELEASE}-algod"); fi
          common+=(--set-string "secretsChecksum=$(printf '%s|%s' "$ALGOD_TOKEN" "$PULL_TOKEN" | sha256sum | cut -c1-16)")
          if [ -n "$ALGOD_URL" ]; then common+=(--set-string "algorand.algodUrl=$ALGOD_URL"); fi

          # Upgrade rules of docs/operations.md: the worker first (it applies schema changes; Recreate so that no old writer runs meanwhile),
          # the API only after the new worker is ready. A first installation has nothing to protect and goes in one step.
          api_image="$(kubectl -n "$NAMESPACE" get deployment "${RELEASE}-${CHAIN}-api" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          if [ -n "$api_image" ] && [ "${api_image##*:}" != "$IMAGE_TAG" ]; then
            echo "Step 1: worker ${IMAGE_TAG}, API stays on ${api_image##*:}"
            helm upgrade --install "$RELEASE" deploy/helm/avm-balance-indexer "${common[@]}" \
              --set-string "image.tag=$IMAGE_TAG" --set-string "image.apiTag=${api_image##*:}" --set worker.strategy=Recreate
          fi
          echo "Step 2: everything on ${IMAGE_TAG}"
          helm upgrade --install "$RELEASE" deploy/helm/avm-balance-indexer "${common[@]}" --set-string "image.tag=$IMAGE_TAG"
      - name: What runs
        if: always()
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          kubectl -n "$NAMESPACE" get pods,svc,ingress -l "app.kubernetes.io/instance=$RELEASE" -o wide || true
      - name: Smoke test
        env:
          HOST: ${{ inputs.host }}
          CHAIN: ${{ inputs.chain }}
        run: |
          # The ingress and its certificate can take a few minutes after the first install; a failure here is a warning, not a failed deployment.
          if curl -fsS --retry 12 --retry-delay 15 --retry-all-errors "https://${HOST}/v1/${CHAIN}/status"; then
            echo
          else
            echo "::warning::https://${HOST}/v1/${CHAIN}/status did not answer; check the ingress, DNS and the certificate"
          fi
      # Database change requests (docs/adr/0020): the values list keyspaces to retire, the worker drops them once it follows the chain.
      # This step only reports what the worker log says, after everything else. A refused request (wrong chain, not an indexer keyspace) marks
      # the step failed and raises an error annotation, but not the job: the release itself is deployed and healthy, and the other chains must
      # still be deployed. The words searched for are pinned by RetiredStorageCleanerTests.
      - name: Database change requests
        continue-on-error: true
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -o pipefail
          retired="$(helm get values "$RELEASE" --namespace "$NAMESPACE" --all -o json | jq -r '.storage.cassandra.retiredKeyspaces // [] | join(", ")')"
          if [ -z "$retired" ]; then echo "No retired keyspaces are listed for $RELEASE"; exit 0; fi
          echo "Retired keyspaces of $RELEASE: $retired"
          # Only the replica that holds the writer lease reports, so every worker pod is read. The writer checks once a minute after it
          # took the lease; give it a little time to say what it did.
          lines=""
          for attempt in 1 2 3 4; do
            if ! logs="$(kubectl -n "$NAMESPACE" logs -l "app.kubernetes.io/instance=${RELEASE},app.kubernetes.io/component=worker" --tail=-1 --prefix --max-log-requests 10 2>/dev/null)"; then
              echo "::warning::The worker logs could not be read; check there what happened to the retired keyspaces ($retired)"; exit 0
            fi
            # Here-strings, not pipes from printf: with pipefail a grep that stops at its first match would fail the pipeline on a long log.
            lines="$(grep 'Retired storage' <<< "$logs" | grep -E 'was removed|does not exist|was not removed|still in use|could not be removed' || true)"
            [ -n "$lines" ] && break
            sleep 20
          done
          has() { grep -q "$1" <<< "$lines"; }
          cat <<< "$lines"
          if has 'was not removed'; then
            echo "::error::The worker refused a retired keyspace of $RELEASE; correct storage.cassandra.retiredKeyspaces in the values (the worker log has the reason)"; exit 1
          fi
          if [ -z "$lines" ]; then
            echo "::notice::The workers of $RELEASE have reported nothing about the retired keyspaces ($retired) yet. They are dropped once the chain status is Following; a worker that logs below Information does not report keyspaces that are already gone"
          fi
          if has 'could not be removed'; then
            echo "::warning::A worker of $RELEASE failed to drop a retired keyspace and keeps trying (the worker log has the error; a role without the right to drop keyspaces never succeeds)"
          fi
          if has 'was removed'; then
            echo "::notice::Retired keyspaces of $RELEASE were dropped; take them off storage.cassandra.retiredKeyspaces at the next change"
          fi
          if has 'still in use'; then
            echo "::notice::Retired keyspaces of $RELEASE are not dropped yet: they must be unused and untouched for the quiet period first (the worker tries again every minute)"
          fi

      # Partial rebuild (docs/adr/0021): when the values name a keyspace to fill from, the worker copies it before it indexes, which can take
      # hours. This step only prints what the worker log says; the copy is not waited for. A refused request stops the worker (exit code 1):
      # its reason is in the fatal log line, and is raised as an error annotation (not a failed job: the release is deployed).
      - name: Partial rebuild
        continue-on-error: true
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -o pipefail
          source="$(helm get values "$RELEASE" --namespace "$NAMESPACE" --all -o json | jq -r '.storage.cassandra.forkFrom.keyspace // ""')"
          if [ -z "$source" ]; then echo "No partial rebuild is requested for $RELEASE"; exit 0; fi
          echo "Partial rebuild of $RELEASE from $source"
          if ! logs="$(kubectl -n "$NAMESPACE" logs -l "app.kubernetes.io/instance=${RELEASE},app.kubernetes.io/component=worker" --tail=-1 --prefix --max-log-requests 10 2>/dev/null)"; then
            echo "::warning::The worker logs could not be read; check there what happened to the partial rebuild from $source"; exit 0
          fi
          lines="$(grep 'Partial rebuild of' <<< "$logs" | tail -n 5 || true)"
          [ -n "$lines" ] && cat <<< "$lines"
          if refused="$(grep -E 'The partial rebuild of .* is refused' <<< "$logs" | tail -n 1)" && [ -n "$refused" ]; then
            echo "::error::The partial rebuild of $RELEASE from $source was refused: ${refused}"; exit 1
          fi
          if [ -z "$lines" ]; then
            echo "::notice::The workers of $RELEASE have not reported on the partial rebuild yet; the copy runs before indexing starts and logs its progress every 30 seconds"
          fi
