apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avm.fullname" . }}-api
  labels: {{- include "avm.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels: {{- include "avm.selectorLabels" (merge (dict "component" "api") .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "avm.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: {{ include "avm.image" (merge (dict "component" "api") .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "avm.fullname" . }}-config
          env:
            {{- include "avm.storageEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
