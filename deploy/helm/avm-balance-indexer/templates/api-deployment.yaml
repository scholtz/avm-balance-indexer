apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avm.fullname" . }}-api
  labels: {{- include "avm.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels: {{- include "avm.selectorLabels" (merge (dict "component" "api") .) | nindent 6 }}
  template:
    metadata:
      annotations:
        # New configuration (for example the telemetry endpoint) restarts the pods.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secretsChecksum }}
        checksum/secrets: {{ .Values.secretsChecksum | quote }}
        {{- end }}
      labels: {{- include "avm.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "avm.image" (merge (dict "component" "api") .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "avm.fullname" . }}-config
          env:
            {{- include "avm.storageEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
