apiVersion: v1
kind: Service
metadata:
  name: {{ include "avm.fullname" . }}-api
  labels: {{- include "avm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      name: http
  selector: {{- include "avm.selectorLabels" (merge (dict "component" "api") .) | nindent 4 }}
