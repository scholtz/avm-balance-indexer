apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avm.fullname" . }}-config
  labels: {{- include "avm.labels" . | nindent 4 }}
data:
  Chain: {{ .Values.chain | quote }}
  Storage__Provider: {{ .Values.storage.provider | quote }}
  Storage__PostgreSql__AccountHashPartitions: {{ .Values.storage.postgreSql.accountHashPartitions | quote }}
  Storage__Cassandra__UseTls: {{ .Values.storage.cassandra.useTls | quote }}
  Storage__Cassandra__Port: {{ .Values.storage.cassandra.port | quote }}
  Storage__Cassandra__CreateKeyspace: {{ .Values.storage.cassandra.createKeyspace | quote }}
  Storage__Cassandra__ReplicationFactor: {{ .Values.storage.cassandra.replicationFactor | quote }}
  Storage__Cassandra__Keyspace: {{ .Values.storage.cassandra.keyspace | quote }}
  Storage__Cassandra__LocalDatacenter: {{ .Values.storage.cassandra.localDatacenter | quote }}
  {{- range $i, $cp := .Values.storage.cassandra.contactPoints }}
  Storage__Cassandra__ContactPoints__{{ $i }}: {{ $cp | quote }}
  {{- end }}
  Algorand__AlgodUrl: {{ .Values.algorand.algodUrl | quote }}
  Algorand__ExpectedGenesisHash: {{ .Values.algorand.expectedGenesisHash | quote }}
  {{- range $i, $host := .Values.algorand.gossipHosts }}
  Algorand__GossipHosts__{{ $i }}: {{ $host | quote }}
  {{- end }}
