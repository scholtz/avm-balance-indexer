{{- if and .Values.api.pathBase (or (not (regexMatch "^(/[A-Za-z0-9._~-]+)+$" .Values.api.pathBase)) (regexMatch "(^|/)[.]+(/|$)" .Values.api.pathBase)) }}
{{- fail (printf "api.pathBase must be empty or start with a slash, have no trailing slash and contain only URL-safe segments, not %q" .Values.api.pathBase) }}
{{- end }}
{{- if not (has .Values.logging.format (list "json" "text")) }}
{{- fail (printf "logging.format must be json or text, not %q" .Values.logging.format) }}
{{- end }}
{{- if not (has .Values.logging.level (list "Verbose" "Debug" "Information" "Warning" "Error" "Fatal")) }}
{{- fail (printf "logging.level must be one of Verbose, Debug, Information, Warning, Error, Fatal, not %q" .Values.logging.level) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avm.fullname" . }}-config
  labels: {{- include "avm.labels" . | nindent 4 }}
data:
  Chain: {{ .Values.chain | quote }}
  {{- if .Values.telemetry.otlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.telemetry.otlpEndpoint | quote }}
  {{- end }}
  {{- if .Values.telemetry.otlpMetricsEndpoint }}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: {{ .Values.telemetry.otlpMetricsEndpoint | quote }}
  {{- end }}
  {{- if or .Values.telemetry.otlpEndpoint .Values.telemetry.otlpMetricsEndpoint }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.telemetry.otlpProtocol | quote }}
  {{- end }}
  Logging__Format: {{ .Values.logging.format | quote }}
  Serilog__MinimumLevel__Default: {{ .Values.logging.level | quote }}
  Worker__HealthPort: {{ .Values.worker.healthPort | quote }}
  Api__RateLimitPerMinute: {{ .Values.api.rateLimitPerMinute | quote }}
  Api__RequestTimeoutSeconds: {{ .Values.api.requestTimeoutSeconds | quote }}
  Api__TrustForwardedHeaders: {{ .Values.api.trustForwardedHeaders | quote }}
  Api__ForwardedHeadersLimit: {{ .Values.api.forwardedHeadersLimit | quote }}
  {{- range $i, $network := .Values.api.knownProxyNetworks }}
  Api__KnownProxyNetworks__{{ $i }}: {{ $network | quote }}
  {{- end }}
  Api__PublishOpenApi: {{ .Values.api.publishOpenApi | quote }}
  Api__PathBase: {{ .Values.api.pathBase | quote }}
  Scans__MaxActive: {{ .Values.scans.maxActive | quote }}
  Scans__Retention: {{ .Values.scans.retention | quote }}
  Scans__StaleAfter: {{ .Values.scans.staleAfter | quote }}
  Storage__Provider: {{ .Values.storage.provider | quote }}
  Storage__PostgreSql__AccountHashPartitions: {{ .Values.storage.postgreSql.accountHashPartitions | quote }}
  Storage__Cassandra__UseTls: {{ .Values.storage.cassandra.useTls | quote }}
  Storage__PostgreSql__ReadTimeoutSeconds: {{ .Values.storage.postgreSql.readTimeoutSeconds | quote }}
  Storage__Cassandra__ReadTimeoutSeconds: {{ .Values.storage.cassandra.readTimeoutSeconds | quote }}
  Storage__PostgreSql__LeaseHeartbeatSeconds: {{ .Values.storage.postgreSql.leaseHeartbeatSeconds | quote }}
  Storage__Cassandra__LeaseTtlSeconds: {{ .Values.storage.cassandra.leaseTtlSeconds | quote }}
  Storage__Cassandra__Port: {{ .Values.storage.cassandra.port | quote }}
  Storage__Cassandra__CreateKeyspace: {{ .Values.storage.cassandra.createKeyspace | quote }}
  Storage__Cassandra__ReplicationFactor: {{ .Values.storage.cassandra.replicationFactor | quote }}
  {{- /* The same rules as the options validator (CassandraOptionsValidator): a wrong value must fail here, not in a pod that cannot start. */}}
  {{- if not (regexMatch "^[A-Za-z][A-Za-z0-9_]{0,47}$" (toString .Values.storage.cassandra.keyspace)) }}
  {{- fail (printf "storage.cassandra.keyspace %q is not a keyspace name (a letter, then letters, digits and underscores, at most 48 characters)" (toString .Values.storage.cassandra.keyspace)) }}
  {{- end }}
  {{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$" (toString .Values.storage.cassandra.localDatacenter)) }}
  {{- fail (printf "storage.cassandra.localDatacenter %q is not a datacenter name" (toString .Values.storage.cassandra.localDatacenter)) }}
  {{- end }}
  Storage__Cassandra__Keyspace: {{ .Values.storage.cassandra.keyspace | quote }}
  Storage__Cassandra__LocalDatacenter: {{ .Values.storage.cassandra.localDatacenter | quote }}
  Storage__Cassandra__RetiredKeyspaceQuietMinutes: {{ .Values.storage.cassandra.retiredKeyspaceQuietMinutes | quote }}
  {{- if and .Values.storage.cassandra.retiredKeyspaces (ne .Values.storage.provider "Cassandra") }}
  {{- fail "storage.cassandra.retiredKeyspaces is only carried out for storage.provider=Cassandra; the list would be ignored" }}
  {{- end }}
  {{- range $i, $retired := .Values.storage.cassandra.retiredKeyspaces }}
  {{- /* The same rules as the options validator: a wrong entry must fail here, not in a pod that then cannot start. */}}
  {{- if not (regexMatch "^[A-Za-z][A-Za-z0-9_]{0,47}$" (toString $retired)) }}
  {{- fail (printf "storage.cassandra.retiredKeyspaces holds %q, which is not a keyspace name (a letter, then letters, digits and underscores, at most 48 characters)" (toString $retired)) }}
  {{- end }}
  {{- if hasPrefix "system" (lower $retired) }}
  {{- fail (printf "storage.cassandra.retiredKeyspaces holds %q, a Cassandra system keyspace" $retired) }}
  {{- end }}
  {{- if eq (lower $retired) (lower $.Values.storage.cassandra.keyspace) }}
  {{- fail (printf "storage.cassandra.retiredKeyspaces holds %q, the keyspace this release uses: it would drop its own data" $retired) }}
  {{- end }}
  Storage__Cassandra__RetiredKeyspaces__{{ $i }}: {{ $retired | quote }}
  {{- end }}
  {{- $contactPoints := .Values.storage.cassandra.contactPoints }}
  {{- if and .Values.cassandra.embedded.enabled (not $contactPoints) }}
  {{- $contactPoints = list (printf "%s-cassandra" (include "avm.fullname" .)) }}
  {{- end }}
  {{- range $i, $cp := $contactPoints }}
  Storage__Cassandra__ContactPoints__{{ $i }}: {{ $cp | quote }}
  {{- end }}
  Algorand__AlgodUrl: {{ .Values.algorand.algodUrl | quote }}
  Algorand__ExpectedGenesisHash: {{ .Values.algorand.expectedGenesisHash | quote }}
  {{- range $i, $host := .Values.algorand.gossipHosts }}
  Algorand__GossipHosts__{{ $i }}: {{ $host | quote }}
  {{- end }}
