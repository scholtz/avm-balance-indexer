apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avm.fullname" . }}-worker
  labels: {{- include "avm.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
{{- if not (has .Values.worker.strategy (list "RollingUpdate" "Recreate")) }}
{{- fail (printf "worker.strategy must be RollingUpdate or Recreate, not %q" .Values.worker.strategy) }}
{{- end }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  # Several replicas may run: the writer lease keeps exactly one of them indexing, the others stand by.
  strategy:
    {{- if eq .Values.worker.strategy "Recreate" }}
    type: Recreate   # no old writer next to a new pod that applies a migration
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  selector:
    matchLabels: {{- include "avm.selectorLabels" (merge (dict "component" "worker") .) | nindent 6 }}
  template:
    metadata:
      annotations:
        # New configuration (for example the telemetry endpoint) restarts the pods.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secretsChecksum }}
        checksum/secrets: {{ .Values.secretsChecksum | quote }}
        {{- end }}
      labels: {{- include "avm.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "avm.image" (merge (dict "component" "worker") .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: health
              containerPort: {{ .Values.worker.healthPort }}
          livenessProbe:
            httpGet: { path: /healthz/live, port: health }
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /healthz/ready, port: health }
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: {{ include "avm.fullname" . }}-config
          env:
            {{- include "avm.storageEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
