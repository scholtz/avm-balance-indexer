# One release per chain deployment. See deploy/helm/values/*.yaml for overlays.
chain: algorand-testnet

image:
  # The images are <repository>-api and <repository>-worker (Docker Hub allows only user/repository names).
  repository: docker.io/scholtz/avm-balance-indexer
  tag: ""          # defaults to Chart.appVersion
  # Per-component tags (default: tag). Upgrade the worker first by setting workerTag alone, then apiTag (docs/operations.md).
  apiTag: ""
  workerTag: ""
  pullPolicy: IfNotPresent

# Pull secrets for a private registry (names of existing kubernetes.io/dockerconfigjson Secrets).
imagePullSecrets: []

storage:
  # PostgreSql | Cassandra  -- selected per deployment, never dual-written.
  provider: PostgreSql
  postgreSql:
    accountHashPartitions: 64
    # Writer lease session check; a dead leader is replaced after about this plus the server keepalive (~30 s).
    leaseHeartbeatSeconds: 5
    # Longest a read may run; longer holder scans fail with 503 instead of holding a snapshot.
    readTimeoutSeconds: 30
    # Secret with key "connectionString"
    existingSecret: ""
  cassandra:
    contactPoints: []
    port: 9042
    # Writer lease row TTL: the longest failover time after a leader dies.
    leaseTtlSeconds: 30
    readTimeoutSeconds: 30
    keyspace: avm_indexer
    localDatacenter: dc1
    # Encrypt the connection; credentials from existingSecret travel in clear text without it.
    useTls: false
    # Let the worker create the keyspace (NetworkTopologyStrategy, replicationFactor replicas in localDatacenter).
    createKeyspace: true
    replicationFactor: 3
    # Secret with keys "username" and "password"
    existingSecret: ""

# A single-node Cassandra started by this release, for clusters without a database operator.
# Needs storage.provider=Cassandra and storage.cassandra.replicationFactor=1. The data lives in a directory of one node.
cassandra:
  embedded:
    enabled: false
    # Directory on the node that keeps the data (created when missing). Required when enabled.
    hostPath: ""
    # Name of the node (label kubernetes.io/hostname) that owns the directory. Required (or nodeSelector): the pod must never
    # start on another node, where the directory would be created empty and a new, empty database would be indexed.
    node: ""
    # Extra node labels instead of or in addition to the node name.
    nodeSelector: {}
    image: cassandra:5.0
    initImage: busybox:1.37
    maxHeapSize: 2G
    heapNewSize: 400M
    resources:
      requests: { cpu: "1", memory: 3Gi }
      limits: { memory: 4Gi }

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: false
    # Secret that holds the certificate; defaults to <release>-<chain>-tls (created by cert-manager when clusterIssuer is set).
    secretName: ""
    # Adds the cert-manager.io/cluster-issuer annotation, for example letsencrypt-prod.
    clusterIssuer: ""

api:
  replicaCount: 2
  # Requests per client IP and minute on the data endpoints (0 = off) and the longest a data request may take.
  rateLimitPerMinute: 600
  requestTimeoutSeconds: 60
  # Take the client address from X-Forwarded-For. Only when the API is reachable exclusively through your ingress.
  trustForwardedHeaders: false
  # Proxies to believe (CIDR list, for example ["10.0.0.0/8"]) and how many hops to peel off X-Forwarded-For (CDN + ingress = 2).
  knownProxyNetworks: []
  forwardedHeadersLimit: 1
  # Serve the OpenAPI description at /openapi/v1.json.
  publishOpenApi: true
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  service:
    type: ClusterIP
    port: 80
  podDisruptionBudget:
    minAvailable: 1

worker:
  # RollingUpdate keeps a writer running during an upgrade. Use Recreate (or scale to 0 first) for a release that contains a schema
  # migration: no writer of the previous version may run while it is applied (docs/operations.md).
  strategy: RollingUpdate
  # One replica indexes (it holds the writer lease), the others stand by and take over within seconds.
  replicaCount: 2
  # Port of /healthz/live and /healthz/ready.
  healthPort: 8081
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

scans:
  # Asynchronous holder scans (see the README): admission limit and retention of results.
  maxActive: 20
  # .NET TimeSpan format: days.hours:minutes:seconds ("24:00:00" would be 24 days).
  retention: "1.00:00:00"
  # A running scan whose owner is silent for this long is taken over by another worker replica.
  staleAfter: "00:02:00"

telemetry:
  # OTLP endpoint of an OpenTelemetry collector, for example http://otel-collector:4317. Empty turns metrics export off.
  otlpEndpoint: ""
  # grpc (collector default port 4317) or http/protobuf (4318).
  otlpProtocol: grpc
  # Backends that take OTLP metrics on a full URL, for example Prometheus (set otlpProtocol to http/protobuf):
  #   http://prometheus:9090/api/v1/otlp/v1/metrics
  otlpMetricsEndpoint: ""

algorand:
  # Algod node used for the latest round and the genesis allocations. Empty uses the chain public endpoint.
  algodUrl: ""
  # Archival gossip nodes (for example http://archive.internal:4160). Empty discovers them through the DNS SRV record.
  gossipHosts: []
  # Base64 genesis hash the chain must present. Pinned for Algorand MainNet, TestNet and Voi; leave empty to use the pin.
  expectedGenesisHash: ""
  # Secret with key "token" holding the algod API token, if the node needs one.
  existingSecret: ""

networkPolicy:
  enabled: true
