# One release per chain deployment. See deploy/helm/values/*.yaml for overlays.
chain: algorand-testnet

image:
  repository: ghcr.io/scholtz/avm-balance-indexer
  tag: ""          # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

storage:
  # PostgreSql | Cassandra  -- selected per deployment, never dual-written.
  provider: PostgreSql
  postgreSql:
    accountHashPartitions: 64
    # Writer lease session check; a dead leader is replaced after about this plus the server keepalive (~30 s).
    leaseHeartbeatSeconds: 5
    # Longest a read may run; longer holder scans fail with 503 instead of holding a snapshot.
    readTimeoutSeconds: 30
    # Secret with key "connectionString"
    existingSecret: ""
  cassandra:
    contactPoints: []
    port: 9042
    # Writer lease row TTL: the longest failover time after a leader dies.
    leaseTtlSeconds: 30
    readTimeoutSeconds: 30
    keyspace: avm_indexer
    localDatacenter: dc1
    # Encrypt the connection; credentials from existingSecret travel in clear text without it.
    useTls: false
    # Let the worker create the keyspace (NetworkTopologyStrategy, replicationFactor replicas in localDatacenter).
    createKeyspace: true
    replicationFactor: 3
    # Secret with keys "username" and "password"
    existingSecret: ""

api:
  replicaCount: 2
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  service:
    type: ClusterIP
    port: 80
  podDisruptionBudget:
    minAvailable: 1

worker:
  # One replica indexes (it holds the writer lease), the others stand by and take over within seconds.
  replicaCount: 2
  # Port of /healthz/live and /healthz/ready.
  healthPort: 8081
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

telemetry:
  # OTLP endpoint of an OpenTelemetry collector (or a backend with an OTLP receiver, for example Prometheus). Empty turns metrics
  # export off. Protocol, headers and interval use the standard OTEL_* variables, add them through extraEnv if needed.
  otlpEndpoint: ""
  otlpProtocol: grpc

algorand:
  # Algod node used for the latest round and the genesis allocations. Empty uses the chain public endpoint.
  algodUrl: ""
  # Archival gossip nodes (for example http://archive.internal:4160). Empty discovers them through the DNS SRV record.
  gossipHosts: []
  # Base64 genesis hash the chain must present. Pinned for Algorand MainNet, TestNet and Voi; leave empty to use the pin.
  expectedGenesisHash: ""
  # Secret with key "token" holding the algod API token, if the node needs one.
  existingSecret: ""

networkPolicy:
  enabled: true
