# Unit tests of the chart's alert rules (templates/prometheusrule.yaml), run by the CI Helm job with `promtool test rules`.
# The job renders the rules of the stage-testnet overlay with alerts.enabled=true into rules.yaml next to this file.
# Series of another chain (voi) must never change the testnet alerts: the rules select avm_chain="algorand-testnet".
rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  - name: a healthy indexer raises nothing
    interval: 1m
    input_series:
      - series: 'avm_indexer_lag_rounds{avm_chain="algorand-testnet"}'
        values: '3x30'
      - series: 'avm_indexer_status_age_seconds{avm_chain="algorand-testnet"}'
        values: '5x30'
      - series: 'avm_worker_is_leader{avm_chain="algorand-testnet",instance="a"}'
        values: '1x30'
      - series: 'avm_worker_is_leader{avm_chain="algorand-testnet",instance="b"}'
        values: '0x30'
    alert_rule_test:
      - { eval_time: 30m, alertname: AvmIndexerLagHigh, exp_alerts: [] }
      - { eval_time: 30m, alertname: AvmIndexerStalled, exp_alerts: [] }
      - { eval_time: 30m, alertname: AvmIndexerNoWriter, exp_alerts: [] }
      - { eval_time: 30m, alertname: AvmIndexerTwoWriters, exp_alerts: [] }

  - name: lag above the threshold for 15 minutes is a warning; another chain's lag is ignored
    interval: 1m
    input_series:
      - series: 'avm_indexer_lag_rounds{avm_chain="algorand-testnet"}'
        values: '600x30'
      - series: 'avm_indexer_lag_rounds{avm_chain="voi"}'
        values: '9000x30'
      - series: 'avm_worker_is_leader{avm_chain="algorand-testnet"}'
        values: '1x30'
    alert_rule_test:
      - { eval_time: 10m, alertname: AvmIndexerLagHigh, exp_alerts: [] }
      - eval_time: 20m
        alertname: AvmIndexerLagHigh
        exp_alerts:
          - exp_labels: { severity: warning, chain: algorand-testnet }

  - name: a status that stops moving is critical after 5 minutes
    interval: 1m
    input_series:
      - series: 'avm_indexer_status_age_seconds{avm_chain="algorand-testnet"}'
        values: '0+60x30'
    alert_rule_test:
      - { eval_time: 6m, alertname: AvmIndexerStalled, exp_alerts: [] }
      - eval_time: 12m
        alertname: AvmIndexerStalled
        exp_alerts:
          - exp_labels: { severity: critical, chain: algorand-testnet }

  - name: no leader, and no worker series at all, are both "no writer"
    interval: 1m
    input_series:
      - series: 'avm_worker_is_leader{avm_chain="algorand-testnet"}'
        values: '0x10'
      - series: 'avm_worker_is_leader{avm_chain="voi"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: AvmIndexerNoWriter
        exp_alerts:
          - exp_labels: { severity: critical, chain: algorand-testnet }

  - name: two leaders for longer than 10 minutes is a warning
    interval: 1m
    input_series:
      - series: 'avm_worker_is_leader{avm_chain="algorand-testnet",instance="a"}'
        values: '1x20'
      - series: 'avm_worker_is_leader{avm_chain="algorand-testnet",instance="b"}'
        values: '1x20'
    alert_rule_test:
      - { eval_time: 5m, alertname: AvmIndexerTwoWriters, exp_alerts: [] }
      - eval_time: 15m
        alertname: AvmIndexerTwoWriters
        exp_alerts:
          - exp_labels: { severity: warning, chain: algorand-testnet }

  - name: a decoder error on blocks warns at once
    interval: 1m
    input_series:
      - series: 'avm_indexer_decoder_errors_total{avm_chain="algorand-testnet",kind="block"}'
        values: '0 0 0 1 1 1'
      - series: 'avm_indexer_decoder_errors_total{avm_chain="algorand-testnet",kind="arc200_log"}'
        values: '0 5 10 15 20 25'
    alert_rule_test:
      - { eval_time: 2m, alertname: AvmIndexerDecoderErrors, exp_alerts: [] }
      - eval_time: 5m
        alertname: AvmIndexerDecoderErrors
        exp_alerts:
          - exp_labels: { severity: warning, chain: algorand-testnet }

  - name: more than 5 percent of API requests failing is a warning
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{avm_chain="algorand-testnet",http_response_status_code="200"}'
        values: '0+90x30'
      - series: 'http_server_request_duration_seconds_count{avm_chain="algorand-testnet",http_response_status_code="503"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AvmApiErrors
        exp_alerts:
          - exp_labels: { severity: warning, chain: algorand-testnet }

  - name: no worker series at all is "no writer" too
    interval: 1m
    input_series:
      - series: 'avm_worker_is_leader{avm_chain="voi"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: AvmIndexerNoWriter
        exp_alerts:
          - exp_labels: { severity: critical, chain: algorand-testnet }

  - name: a backfill far behind but catching up is not a lag alert
    interval: 1m
    input_series:
      - series: 'avm_indexer_lag_rounds{avm_chain="algorand-testnet"}'
        values: '5000000-1000x60'
    alert_rule_test:
      - { eval_time: 50m, alertname: AvmIndexerLagHigh, exp_alerts: [] }

  - name: a lag that stays high but moves up and down is still a lag alert
    interval: 1m
    input_series:
      - series: 'avm_indexer_lag_rounds{avm_chain="algorand-testnet"}'
        values: '2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010 2000 1990 2010'
    alert_rule_test:
      - eval_time: 55m
        alertname: AvmIndexerLagHigh
        exp_alerts:
          - exp_labels: { severity: warning, chain: algorand-testnet }

  - name: a lost lease more than 3 times an hour is flapping
    interval: 1m
    input_series:
      - series: 'avm_worker_leases_lost_total{avm_chain="algorand-testnet"}'
        values: '0 1 2 3 4 5 5 5 5 5'
    alert_rule_test:
      - eval_time: 9m
        alertname: AvmIndexerLeaseFlapping
        exp_alerts:
          - exp_labels: { severity: warning, chain: algorand-testnet }

  - name: status reads failing for 10 minutes is a warning
    interval: 1m
    input_series:
      - series: 'avm_indexer_status_sample_failures_total{avm_chain="algorand-testnet"}'
        values: '0+4x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: AvmIndexerStatusUnreadable
        exp_alerts:
          - exp_labels: { severity: warning, chain: algorand-testnet }

  - name: an API p95 above the threshold for 10 minutes is a warning
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_bucket{avm_chain="algorand-testnet",le="1"}'
        values: '0+1x30'
      - series: 'http_server_request_duration_seconds_bucket{avm_chain="algorand-testnet",le="7.5"}'
        values: '0+2x30'
      - series: 'http_server_request_duration_seconds_bucket{avm_chain="algorand-testnet",le="10"}'
        values: '0+100x30'
      - series: 'http_server_request_duration_seconds_bucket{avm_chain="algorand-testnet",le="+Inf"}'
        values: '0+100x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: AvmApiSlow
        exp_alerts:
          - exp_labels: { severity: warning, chain: algorand-testnet }
