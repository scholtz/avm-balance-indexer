# Release "voi" in namespace avm-balance-indexer (see deploy/README.md).
chain: voi
storage:
  provider: Cassandra
  cassandra:
    keyspace: avm_voi
    replicationFactor: 1
cassandra:
  embedded:
    enabled: true
    hostPath: /mnt/nvme1/avm-balance-indexer/voi
ingress:
  enabled: true
  host: voi.balance-indexer.biatec.io
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
api:
  replicaCount: 2
