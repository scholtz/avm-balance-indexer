# Namespace-scoped account for the GitHub workflows (docs/deployment-pipelines.md). Apply once as a cluster admin:
#   kubectl apply -f deploy/rbac/deployer.yaml
# It can manage everything the chart renders inside the namespace avm-balance-indexer and nothing outside of it.
apiVersion: v1
kind: Namespace
metadata:
  name: avm-balance-indexer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: avm-balance-indexer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
  namespace: avm-balance-indexer
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, pods, pods/log, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
  namespace: avm-balance-indexer
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: avm-balance-indexer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-deployer
---
# Kubernetes 1.24+ does not create a token for a ServiceAccount; this Secret asks for a long-lived one.
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  namespace: avm-balance-indexer
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
