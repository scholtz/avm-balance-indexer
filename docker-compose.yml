# Local development databases. The API/worker pick one via Storage:Provider.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: avm_indexer
      POSTGRES_USER: avm
      POSTGRES_PASSWORD: avm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avm -d avm_indexer"]
      interval: 5s
      timeout: 3s
      retries: 20

  cassandra:
    image: cassandra:5.0
    environment:
      CASSANDRA_CLUSTER_NAME: avm-local
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    ports:
      - "9042:9042"
    volumes:
      - cassandradata:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' localhost 9042"]
      interval: 15s
      timeout: 10s
      retries: 30

volumes:
  pgdata:
  cassandradata:
