[package]
name = "avm-balance-indexer"
version = "1.1.0"
edition = "2021"
rust-version = "1.89"
description = "Rust SDK for the AVM Balance Indexer: token balances, holders and history for Algorand, Algorand TestNet and Voi."
license = "MIT"
readme = "README.md"
repository = "https://github.com/scholtz/avm-balance-indexer"
homepage = "https://github.com/scholtz/avm-balance-indexer/tree/main/sdk/rust"
keywords = ["algorand", "voi", "indexer", "blockchain", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**/*", "README.md", "AGENTS.md", "LICENSE", "Cargo.toml"]

[dependencies]
bytes = "1.9"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
httpdate = "1"
progenitor-client = "0.15.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_urlencoded = "0.7"
uuid = { version = "1.0", features = ["serde", "v4"] }
tokio = { version = "1", default-features = false, features = ["time", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
serde_json = "1"
futures-util = { version = "0.3", features = ["std"] }
